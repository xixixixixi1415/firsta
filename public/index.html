  function chunkText(text) {

}

  if (anotherPrice === "" || isNaN(Number(anotherPrice))) {

    if (anotherChoice.length > 5) {

    function sendout(){

    }if (price === "" || isNaN(Number(price))) {
    alert("bro不要亂寫");

}if (choice.length > 5) {

if (shop.length > 5) {

  // 3. 按下確認送出時執行的函式
  function submitUsername() {
    const username = usernameInput.value.trim(); // 取得輸入值並清除前後空白
    
    if (username === "") {
      alert("請輸入有效的用戶名！"); // 如果沒寫名字，不給關閉並提示
      return;

  function resetPage() {

    document.querySelector("#orderTable tbody").replaceChildren();
    updateShopSummary();

  }

  // 4. 在輸入框按下 Enter 鍵也能直接送出（已補上缺少的括號）
  usernameInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      submitUsername();
    }
  }); // <-- 修正這裡的括號結構
  function changeImg(fileName, element) {
    const targetImage = document.getElementById('myImage');
    const orderForm = document.querySelector('.order-form');
    shop = element.textContent; // 👈 這行就是「讀取你點到的那一格的文字」

    // 1. 點擊清單時，先讓點餐表單顯示出來
    if (orderForm) {
        orderForm.style.display = 'block';
       
    }

    // 2. 先把舊圖片變透明（淡出）
    targetImage.style.opacity = 0;

    // 3. 在後台建立一個虛擬圖片，用來精準量測新圖片的高度
    const tempImg = new Image();
    tempImg.src = fileName;

    // 4. 當新圖片在後台載入完成後，再同時執行「拉長高度」與「淡入」
    tempImg.onload = function() {
        // 計算新圖片應該要有的正確高度
        const currentWidth = targetImage.offsetWidth || 400; 
        const ratio = tempImg.height / tempImg.width;       
        const newHeight = currentWidth * ratio;             

        // 延遲一下下（等前面淡出完成），再把新圖放進去、拉長並變亮
        setTimeout(function() {
            targetImage.src = fileName;          // 換新圖
            targetImage.style.height = newHeight + 'px'; // 慢慢拉長/縮短高度
            targetImage.style.opacity = 1;       // 慢慢淡入變亮
        }, 70);
    };
}    
let currentMode = "shop";

function switchSummary(mode) {
    currentMode = mode;
    const btnShop = document.getElementById("btnShop");
    const btnUser = document.getElementById("btnUser");
    
    if (mode === "shop") {
        btnShop.style.background = "#a7a7a7";
        btnUser.style.background = "#ccc";
    } else {
        btnShop.style.background = "#ccc";
        btnUser.style.background = "#a7a7a7"; 
    }
    updateShopSummary();
}

function updateShopSummary() {
    const tbody = document.querySelector("#orderTable tbody");
     if (!tbody) return;
    const rows = tbody.querySelectorAll("tr");
    let summaryList = document.getElementById("shopSummaryList") || document.querySelector(".summary-list");
    if (!summaryList) return;

    summaryList.innerHTML = "";

    // 🌟 關鍵修改：不從網頁抓，直接改用您在前面已經存好的用戶名變數（假設變數叫 loginUser）
    // ⚠️ 請把下面的 loginUser 改成您實際宣告的全域變數名稱
    const currentUserName = usernamestore; 

    if (currentMode === "shop") {
    // 建立一個空物件來統計各店金額，格式如：{ "炸雞店": 120, "飲料店": 80 }
    let shopTotals = {};

    // 1. 遍歷每一列表格，累加各店金額
    rows.forEach(row => {
        const tds = row.querySelectorAll("td");
        // 依您剛才的結構（姓名、店、項目、錢），店在第 2 格(index 1)，錢在第 4 格(index 3)
        if (tds.length >= 4) {
            const shopName = tds[1].innerText.trim();  
            const price = Number(tds[3].innerText.trim()); 
            
            if (!isNaN(price)) {
                if (!shopTotals[shopName]) {
                    shopTotals[shopName] = 0;
                }
                shopTotals[shopName] += price;
            }
        }
    });


    // 4. 跑迴圈把最新算好的店家資料，變成 <li class="summary-item"> 塞進去
    for (const shopName in shopTotals) {
        const newLi = document.createElement("li");
        newLi.className = "summary-item";
        
        // 🎯 完美符合需求：只放店名和它付的錢
        newLi.innerHTML = `<button class="row-btn" style="background: #AC5341; color: white; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer;"></button><strong>${shopName}</strong>：<span class="count-badge">${shopTotals[shopName]}</span> 億`;
        const tableBtn = newLi.querySelector(".row-btn");
        tableBtn.dataset.shopName = shopName;
        tableBtn.textContent = shopButtonLabels.get(shopName) || "我付";
        tableBtn.addEventListener("click", () => {
          activeTableButton = tableBtn;
          
          document.getElementById("my-dialog").showModal();
        });
        summaryList.appendChild(newLi);
    }
}else {
        // ==========================================
        // 模式二：顯示【個人點餐】
        // ==========================================
        rows.forEach(row => {
            const tds = row.querySelectorAll("td");
            if (tds.length >= 4) {
                const username = tds[0].innerText.trim();   
                const shopName = tds[1].innerText.trim();   
                const choice = tds[2].innerText.trim();     
                const price = tds[3].innerText.trim();      

                // 🔍 精准過濾：比對大表格裡的名字，是否與您的全域變數一模一樣
                if (username === usernamestore) {
                    const newLi = document.createElement("li");
                    newLi.className = "summary-item";
                    newLi.innerHTML = ` 【${shopName}】${choice}：<span class="count-badge">${price}</span> 億 <button style="background: #AC5341; color: white; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer;">刪除</button>`;
                    newLi.querySelector("button").addEventListener("click", () => {
                        row.remove();
                        updateShopSummary();
                    });
                    
                    summaryList.appendChild(newLi);
                }
            }
        });
        // 防呆
        if (summaryList.children.length === 0) {
            summaryList.innerHTML = `<li class="summary-item" style="color:#999;">${currentUserName}你還沒點欸</li>`;
        }
    }
}
